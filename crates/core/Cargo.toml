[package]
name = "latexpat-core"
description = "Pattern flattening for latex (natural rubber sheet) garments"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Embed the MakeHuman-based body model (about 2 MB) in the library.
bundled-body = []
serde = ["dep:serde", "glam/serde"]

[dependencies]
glam.workspace = true
faer.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
serde_json.workspace = true

[[example]]
name = "gen_garment_examples"
required-features = ["serde", "bundled-body"]
