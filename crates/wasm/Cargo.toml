[package]
name = "latexpat-wasm"
description = "WebAssembly entry point for latexpat (JSON in, JSON out)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
latexpat-core = { workspace = true, features = ["serde", "bundled-body"] }
serde.workspace = true
serde_json.workspace = true
