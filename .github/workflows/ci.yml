name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Docs
        run: cargo doc --workspace --no-deps

      - name: Core builds for WebAssembly
        run: cargo build -p latexpat-core --features serde --target wasm32-unknown-unknown

      - name: Build web app
        run: web/build.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners, so no
      # browser download or apt packages are needed (apt mirrors are a
      # frequent source of flaky failures).
      - name: Browser smoke test
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PW_CHANNEL: chrome
        run: |
          npm install --no-save --no-package-lock playwright
          python3 -m http.server -d web 8765 &
          sleep 1
          node web/smoke-test.cjs http://localhost:8765/

      # Everything the page loads: scripts, styles, the module and the
      # example projects (not the build script or the smoke test).
      - name: Collect site
        run: |
          mkdir _site
          cp -r web/. _site/
          rm _site/build.sh _site/smoke-test.cjs
          test -f _site/viewer.js && test -f _site/examples/top.project.json

      # On pull requests, the built site as a download to try locally.
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: _site
          retention-days: 14

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
